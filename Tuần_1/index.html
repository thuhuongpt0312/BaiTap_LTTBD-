<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hồ sơ sinh viên</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9edf2;--screen:#fff;--ink:#1c2430;--muted:#5b6573;--green:#27a567;--green-soft:#e6f5ed;--line:#e3e8ee;--ring:#dbeafe}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#11151b;--screen:#1a2029;--ink:#eef2f6;--muted:#9aa5b4;--green:#3cc283;--green-soft:#1f3a2e;--line:#2a323d;--ring:#24344d}}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:"Be Vietnam Pro",system-ui,sans-serif;background:var(--bg);color:var(--ink);display:flex;align-items:center;justify-content:center}
.phone{width:min(100%,390px);height:min(100%,780px);background:var(--screen);border-radius:36px;box-shadow:0 0 0 10px #2b3a2f,0 20px 50px rgba(0,0,0,.25);position:relative;overflow:hidden;display:flex;flex-direction:column}
@media (max-width:430px){.phone{border-radius:0;box-shadow:none;height:100%}}
header{display:flex;justify-content:space-between;padding:calc(18px + env(safe-area-inset-top,0px)) 18px 0}
.icon-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--screen);color:var(--ink);display:grid;place-items:center;cursor:pointer}
.icon-btn.accent{background:var(--green-soft);border-color:transparent;color:var(--green)}
.icon-btn:focus-visible,.sid:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.icon-btn:active{transform:scale(.94)}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-bottom:60px;text-align:center}
.avatar{width:128px;height:128px;border-radius:50%;background:var(--ring);overflow:hidden;margin-bottom:22px}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
h1{font-size:20px;font-weight:700;letter-spacing:.2px}
.sid{margin-top:4px;background:none;border:0;font:inherit;font-size:15px;color:var(--muted);cursor:pointer;padding:4px 8px;border-radius:8px}
.toast{position:absolute;left:50%;bottom:28px;transform:translate(-50%,20px);background:var(--ink);color:var(--screen);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.25s}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<div class="phone">
  <header>
    <button class="icon-btn" id="back" aria-label="Quay lại">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    </button>
    <button class="icon-btn accent" id="doc" aria-label="Xem thẻ sinh viên">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8 8h8M8 12h8M8 16h4"/></svg>
    </button>
  </header>
  <main>
    <div class="avatar">
      <img id="avatar" src="assets/avatar.jpg" alt="Ảnh đại diện Phan Thị Thu Hương">
    </div>
    <h1 id="name">Phan Thị Thu Hương</h1>
    <button class="sid" id="sid" title="Chạm để sao chép">067306005888</button>
  </main>
  <div class="toast" id="toast" role="status"></div>
</div>
<script>
const student={name:"Phan Thị Thu Hương",id:"067306005888"};
document.getElementById("name").textContent=student.name;
document.getElementById("sid").textContent=student.id;


const img=document.getElementById("avatar");
img.onerror=()=>{img.onerror=null;img.src="data:image/svg+xml;utf8,"+encodeURIComponent(
`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 128 128'><rect width='128' height='128' fill='#dbeafe'/><circle cx='64' cy='50' r='22' fill='#93b4e0'/><path d='M20 128c4-30 24-44 44-44s40 14 44 44z' fill='#93b4e0'/></svg>`)};

const toast=document.getElementById("toast");let t;
function show(msg){toast.textContent=msg;toast.classList.add("show");clearTimeout(t);t=setTimeout(()=>toast.classList.remove("show"),1800)}
document.getElementById("back").onclick=()=>{history.length>1?history.back():show("Đây là màn hình đầu tiên")};
document.getElementById("doc").onclick=()=>show("Thẻ sinh viên: "+student.id);
document.getElementById("sid").onclick=async()=>{
  try{await navigator.clipboard.writeText(student.id);show("Đã sao chép mã sinh viên")}
  catch{show("Không sao chép được, hãy chọn và sao chép thủ công")}
};
</script>
</body>
</html>
